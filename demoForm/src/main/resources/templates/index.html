<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: green;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Student Registration</h1>
    <form action="/save-student" method="post">

        <div class="form-group">
            <label>Name</label>
            <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

        </div>

        <div class="form-group">
            <label>Phone</label>
            <input
                    type="text"
                    name="phone"
                    placeholder="Enter your phone"
                    required>
        </div>


        <button type="submit">
            Save Student
        </button>
    </form>


    <div
            class="message"
            th:if="${message}"
            th:text="${message}">
    </div>

</div>
</body>
</html>
